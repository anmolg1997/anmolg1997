<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <clipPath id="frame"><rect width="1200" height="300" rx="20"/></clipPath>
    <radialGradient id="gA"><stop offset="0" stop-color="#7C3AED" stop-opacity="0.55"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
    <radialGradient id="gB"><stop offset="0" stop-color="#14B8A6" stop-opacity="0.30"/><stop offset="1" stop-color="#14B8A6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gC"><stop offset="0" stop-color="#4F46E5" stop-opacity="0.35"/><stop offset="1" stop-color="#4F46E5" stop-opacity="0"/></radialGradient>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="#07070B"/>
    <circle cx="1020" cy="40" r="380" fill="url(#gA)">
      <animateTransform attributeName="transform" type="translate" values="0 0; -70 45; 25 -20; 0 0" dur="26s" repeatCount="indefinite"/>
    </circle>
    <circle cx="790" cy="310" r="310" fill="url(#gB)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 90 -35; -45 20; 0 0" dur="34s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="300" r="270" fill="url(#gC)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 35 -45; -25 12; 0 0" dur="40s" repeatCount="indefinite"/>
    </circle>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="19.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <text x="84" y="80" font-size="13" font-weight="600" letter-spacing="6" fill="#A78BFA">APPLIED AI ENGINEER
    <animate attributeName="opacity" from="0" to="1" dur="0.7s" fill="freeze"/>
  </text>

  <text x="82" y="144" font-size="54" font-weight="700" letter-spacing="-1" fill="#F5F5F7">Anmol Jaiswal
    <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0.15s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" dur="0.9s" begin="0.15s" fill="freeze"/>
  </text>

  <rect x="84" y="162" width="56" height="2" rx="1" fill="#7C3AED">
    <animate attributeName="width" from="0" to="56" dur="1.1s" begin="0.5s" fill="freeze"/>
  </rect>

  <g font-size="20" font-weight="600" fill="#C4B5FD">
    <text x="84" y="200" opacity="1">Multi-Agent AI Architect
      <animate attributeName="opacity" values="1;1;0;0;0;0;0;0;1" keyTimes="0;0.20;0.25;0.45;0.5;0.70;0.75;0.95;1" dur="16s" repeatCount="indefinite"/>
    </text>
    <text x="84" y="200" opacity="0">Enterprise RAG Specialist
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.20;0.25;0.45;0.5;1" dur="16s" repeatCount="indefinite"/>
    </text>
    <text x="84" y="200" opacity="0">LLM Fine-Tuning &amp; Serving
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.45;0.5;0.70;0.75;1" dur="16s" repeatCount="indefinite"/>
    </text>
    <text x="84" y="200" opacity="0">Knowledge Graph Engineer
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.70;0.75;0.95;1" dur="16s" repeatCount="indefinite"/>
    </text>
  </g>

  <rect x="84" y="226" width="1032" height="1" fill="#FFFFFF" fill-opacity="0.07"/>

  <text x="84" y="260" font-size="14" fill="#9BA1AC">15+ upstream PRs merged<tspan fill="#7C3AED" font-weight="700">&#160;&#160;&#183;&#160;&#160;</tspan>PyPI author, listed in the official ADK catalog<tspan fill="#7C3AED" font-weight="700">&#160;&#160;&#183;&#160;&#160;</tspan>3,000+ contributions in the past year</text>
</svg>
